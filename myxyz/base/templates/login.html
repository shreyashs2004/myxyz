{% extends 'main.html' %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <div class="login-logo">

            <h1>
                VTU Portal
            </h1>

            <p>
                Student Result Management System
            </p>

        </div>

        {% if error %}

            <div class="error-box">
                {{ error }}
            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="input-box">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required
                >

            </div>

            <div class="input-box">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>

        <div class="extra-links">
<br>
            <a href="/forgot-password/">
                Forgot Password?
            </a>
            &nbsp;&nbsp; 
            <a class="forgot-link" href="/register/">
    New Student Register
</a>
        </div>

    </div>

</div>

{% endblock %}
